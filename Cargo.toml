[workspace]
# 只有运行时本体 + ABI 契约 + 插件。插件 SDK 在另一个仓库（FuyuBot-SDK），
# 文档站在第三个仓库（FuyuBot-Docs）；这里不再编 `fuyubot-sdk`。
# 按角色分目录，别再把插件和库混在一起：
#   crates/    运行时库（含发 crates.io 的 abi / tdlib-sys）
#   plugins/   内置插件（随发布包分发）
#   examples/  示例插件；replay/ 是回放数据不是 crate，所以示例 crate 单独点名
#   tests/     测试夹具插件（集成测试用 `cargo build -p` 编它们）
members = ["crates/*", "plugins/*", "examples/fuyubot-plugin-demo", "tests/*"]
# 裸 `cargo build` / `cargo test` 只编运行时与内置插件；示例与夹具按需 `-p`。
default-members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
# 0.1.0 是首次公开版本（crates.io 上这两个 crate 之前一个版本都没有）。
# 0.1.1 给 `HostApiVTable` 尾部加了 `provide_service_shared`（服务作用域）。
# 0.1.2 加了 `simplify_invoke` / `simplify_invoke_result`（ABI 4 → 5，simplify 下沉到宿主）——
# 都是破坏性改动，所以 SDK 侧的依赖也一起顶到最新版。
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
# `fuyubot-abi` / `fuyubot-tdlib-sys` 会发到 crates.io（SDK 仓库依赖它们）。
repository = "https://github.com/CatMoeCircle/Fuyu-Bot"

[workspace.dependencies]
fuyubot-abi = { path = "crates/fuyubot-abi", version = "0.1.2" }
fuyubot-cli = { path = "crates/fuyubot-cli", version = "0.1.2" }
fuyubot-core = { path = "crates/fuyubot-core", version = "0.1.2" }
fuyubot-event = { path = "crates/fuyubot-event", version = "0.1.2" }
fuyubot-loader = { path = "crates/fuyubot-loader", version = "0.1.2" }
fuyubot-middleware = { path = "crates/fuyubot-middleware", version = "0.1.2" }
fuyubot-service = { path = "crates/fuyubot-service", version = "0.1.2" }
fuyubot-simplify = { path = "crates/fuyubot-simplify", version = "0.1.2" }
fuyubot-tdlib = { path = "crates/fuyubot-tdlib", version = "0.1.2" }
fuyubot-tdlib-sys = { path = "crates/fuyubot-tdlib-sys", version = "0.1.2" }
fuyubot-tool = { path = "crates/fuyubot-tool", version = "0.1.2" }

cbindgen = "0.29.4"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
jsonschema = { version = "0.58.6", default-features = false }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9.12"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# 开发迭代用：比 dev 略高优化，保留完整调试信息。
[profile.debug]
inherits = "dev"
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
