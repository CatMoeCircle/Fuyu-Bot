[workspace]
# 只有运行时本体 + ABI 契约 + 插件。脚本插件宿主在另一个仓库（FuyuBot-Script），
# 文档站在第三个仓库（FuyuBot-Docs）；这里不再编任何 SDK。
# 按角色分目录，别再把插件和库混在一起：
#   crates/    运行时库（含发 crates.io 的 abi）
#   plugins/   三个内置插件（/start、/help、/plugins）
#   examples/  示例插件；replay/ 是回放数据不是 crate，所以示例 crate 单独点名
#   tests/     测试夹具插件（集成测试用 `cargo build -p` 编它们）
members = ["crates/*", "plugins/*", "examples/fuyubot-plugin-demo", "tests/*"]
# 裸 `cargo build` / `cargo test` 只编运行时与内置插件；示例与夹具按需 `-p`。
default-members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
# 0.1.0 是首次公开版本（crates.io 上之前一个版本都没有）。
# 0.1.1 给 `HostApiVTable` 尾部加了 `provide_service_shared`（服务作用域）。
# 0.1.2 加了 `simplify_invoke` / `simplify_invoke_result`（ABI 4 → 5，simplify 下沉到宿主）。
# 0.1.3 是宿主层的一轮：`fuyubot-app` 编排层 + Android JNI 运行时、插件分发格式 v1（bundle）、
# `run --tui` 终端面板与插件商店；**ABI 仍是 v5，这次没动契约**。
# sqlite 服务插件不在这里：它随 0.1.3 挪到独立仓库 FuyuBot-SQLite（可选服务，不进发布包）。
# 0.1.4 把服务调用改成**经过宿主**（ABI 5 → 6）：`HostApiVTable` 尾部加 `call_service`，
# 宿主在调用期间记下调用方，`current_plugin` 因此在插件自己的线程上也认得出「谁在调我」。
# ⚠️ 版本是精确相等判定：0.1.4 宿主不加载 0.1.3 编的插件，反之亦然，插件必须重编。
# 0.1.4 是正式版：在 rc.1 的命令闸门 / 命令回复、`[command]` 命令头数组与 user 白名单开关、
# 配置写回保留注释、插件展示元数据之上，又并入了 TDLib 1.8.70 适配、Android 改从
# `<root>/fuyubot.toml` 读配置（`nativeInitConfig`）与 `/help` 按插件分组；ABI 仍是 v6。
# 0.1.5：命令能力表与 TDLib 对象缓存迁入宿主（`/help` 只读能力表，按 role/scopes/hidden
# 过滤；旧 `fuyubot.help.commands` 保留为别名），主人/管理员不受白名单影响，user 账户
# 在 owners 为空时默认自己是主人；TUI 支持无子命令入口、`s` 自动登录与首次凭据填写，
# `init` 支持 `--api-hash`；ABI 仍为 v6，0.1.4 的 v6 插件可继续加载。
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
# `fuyubot-abi` / `fuyubot-tdlib-sys` 会发到 crates.io。
# ⚠️ 这两个包的**版本是独立版本线**，不跟上面 `version` 的 bot 版本走：清单里各自写死
# （abi 0.1.3 = ABI v6 首发；sys 0.1.3 = 首个随包带 TDLib 1.8.70 schema 的版本）。
repository = "https://github.com/CatMoeCircle/Fuyu-Bot"

[workspace.dependencies]
fuyubot-abi = { path = "crates/fuyubot-abi", version = "0.1.3" }
# 宿主编排层：CLI 与 Android JNI 共用同一条启动顺序。
fuyubot-app = { path = "crates/fuyubot-app", version = "0.1.5" }
fuyubot-cli = { path = "crates/fuyubot-cli", version = "0.1.5" }
fuyubot-core = { path = "crates/fuyubot-core", version = "0.1.5" }
fuyubot-event = { path = "crates/fuyubot-event", version = "0.1.5" }
fuyubot-loader = { path = "crates/fuyubot-loader", version = "0.1.5" }
fuyubot-middleware = { path = "crates/fuyubot-middleware", version = "0.1.5" }
fuyubot-service = { path = "crates/fuyubot-service", version = "0.1.5" }
fuyubot-simplify = { path = "crates/fuyubot-simplify", version = "0.1.5" }
fuyubot-tdlib = { path = "crates/fuyubot-tdlib", version = "0.1.5" }
fuyubot-tdlib-sys = { path = "crates/fuyubot-tdlib-sys", version = "0.1.3" }
fuyubot-tool = { path = "crates/fuyubot-tool", version = "0.1.5" }

cbindgen = "0.29.4"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
jsonschema = { version = "0.58.6", default-features = false }
# Android JNI 运行时（`crates/fuyubot-android` → `libfuyubotjni.so`）。
# 纯 Rust 的 FFI 声明，桌面也编得动——这样 `cargo build --workspace` 能一直盯着它。
jni = "0.21.1"
libloading = "0.9.0"
# 终端操作面板（`run --tui`）。只给 CLI：库 crate 不依赖它（与约束 40 同理）。
# 只要 crossterm 后端 + 核心 widget（日历 / 宏这些默认特性用不上，少拖时间 / proc-macro 依赖）。
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# 日志行按显示宽度折行（中文占两列）；同样是 CLI 面板专用。
unicode-width = "0.2.3"
# 面板底部的进程 CPU / 内存占用。只要 `system` 特性（disk / network / gpu / user 都不拖）。
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2.0.21"
# 控制台日志的时间列：`time` 只给 CLI 用（`local-offset` 在 Windows 上是对 kernel32 的
# 直接 FFI，不多拖依赖）；库 crate 只发 `tracing` 事件，不碰时间格式。
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9.12"
# 结构化日志：插件名 / 更新类型进字段，控制台、文件与 TUI 各自决定怎么显示。
# `tracing-subscriber` 刻意不启 `env-filter`（它会拖 matchers + regex-automata），
# 级别过滤由 `HostRuntime` 在源头做，这样才能被 `.fuyubot/log-level` 运行期改。
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "smallvec", "std"] }
# `gzip`：商店索引 / 明细分片在 GitHub Pages 上是 gzip 的，客户端要能自己解
# （ureq 会在开了这个 feature 时自动加 `Accept-Encoding: gzip` 并解压；`flate2` 本来
# 就因 `zip` 在 CLI 依赖树里，不引入新 crate 到运行时）。
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
# TUI 插件商店的 zip 解包。**只给 CLI**：加载器与运行时永远不碰压缩包（P1 的边界）。
# 只要 deflate（flate2 后端）：aes/bzip2/zstd/xz 这些作者包里用不到，别拖一串 C 依赖。
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# 开发迭代用：比 dev 略高优化，保留完整调试信息。
[profile.debug]
inherits = "dev"
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
