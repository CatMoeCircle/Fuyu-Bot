[package]
name = "fuyubot-sdk-cli"
description = "fuyubot-sdk：插件开发 CLI（脚手架 / ABI 绑定 / 静态检查 / TDLib 方法查询）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "fuyubot-sdk"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fuyubot-abi.workspace = true
# `td-methods` / `td-method` 消费的是编译期烘进二进制的真 `td_api.tl` 元数据
# （`TdApiSchema::compiled()`）——类型与元数据都在 sys，不拖加载层。
fuyubot-tdlib-sys.workspace = true
# `check` 用它在**不加载**插件的前提下读导出符号（规格要求「不加载、不运行」）。
object.workspace = true
