# 由 `fuyubot-sdk init` 生成：独立插件 crate，**不属于任何 workspace**。
#
# 那个空的 [workspace] 不是多余的：没有它，cargo 会一路往上找父目录里的
# workspace 声明，然后报「current package believes it's in a workspace when it's not」。
[workspace]

[package]
name = "__CRATE__"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# 插件必须编成 cdylib：宿主 dlopen 的就是它。
[lib]
crate-type = ["cdylib"]

[dependencies]
fuyubot-plugin-api = { path = "__SDK_PATH__", version = "0.1.0" }
