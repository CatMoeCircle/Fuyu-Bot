[package]
name = "fuyubot-abi"
description = "HostApi VTable 定义与插件导出宏"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# 这个 crate 会发到 crates.io：SDK 仓库（FuyuBot-SDK）依赖它。
license.workspace = true
repository.workspace = true

[dev-dependencies]
# 只用 `#[tokio::test]` 验一次「真 waker + 跨线程唤醒」；运行时不依赖 tokio。
tokio.workspace = true

[dependencies]
thiserror.workspace = true
# `ResponseRouter` 要从响应 payload 里读 `request_id`（缺口 10 的 async 形态）。
# 只给 Rust 侧用；C 插件不受影响（头文件里没有它）。
serde_json.workspace = true

[build-dependencies]
cbindgen.workspace = true
