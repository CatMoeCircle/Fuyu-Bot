# fuyubot 项目配置。
#
# `fuyubot run` 会读它；所有键都有默认值。缺这个文件时 `fuyubot run` 会**自动**
# 按本模板生成一份（等价于先跑一次 `fuyubot init`），所以不建也能直接起。

[bot]
name = "__NAME__"

[telegram]
# 账号类型：`bot`（默认）或 `user`。它决定登录走哪条路——
# bot → Bot Token；user → 手机号 / 扫码。**写错会报错**，不会静默当 bot。
account_type = "bot"
# TDLib api_id：到 https://my.telegram.org 申请。它**不是**秘密，放配置里没问题。
api_id = __API_ID__
# TDLib 的数据目录：database 与 files **都**指它（相对项目根目录）。
data_dir = "data"
# ⚠️ api_hash 是**凭据**。每次冷启动都要随 `setTdlibParameters` 发给 TDLib（session
#    有效也一样），所以 `fuyubot run` 交互问过一次后会把它**明文写回下面这一行**——
#    这份文件从此就带着你的应用密钥，别提交到版本库、别整份发给别人。
#    不想落盘就设环境变量 `TG_API_HASH`（环境变量优先，且不会被写回）。
api_hash = ""
# Bot Token / 手机号 / 两步验证密码**从不**写进这个文件：session 有效后它们用不上。

[command]
# 命令头（数组，可以写多个）与触发者白名单。
#
# **不写 `prefix` 就按账号类型取默认值**：bot 认 "/"（`/start`、`/help`…），
# user 认 "."。要自定义就取消下面那行的注释——配了就是**整套替换**，bot 不会
# 额外保留 "/"，要用就把它写进数组。例如：
#   prefix = ["/", ".", "。"]   # bot 同时认 "/"、"."、"。"；
#                               # user 只认 "."、"。"（"/" 始终不交给插件）
# 每一项必须是单个字符（不能是字母、数字或空白）；写错的那项会告警并跳过，
# 一个能用的都没有时回退到账号默认值。
# prefix = ["."]
# 允许触发命令的用户 id（数字）。user 账户下自己发的命令始终触发，这张表
# 用来额外放行别人；bot 账户填了就只响应表里的用户。空表：user 只认自己，
# bot 不限制。
whitelist = []
# user 账户的**白名单模式**（默认 true）：只响应自己发的命令与 whitelist 里的用户。
# ⚠️ **不建议关闭**：改成 false 后，任何人发来的命令都会触发插件（user 账户尤其危险）。
# 关掉后 whitelist 对 user 不再起作用；bot 账户的 whitelist 规则不受这个开关影响。
whitelist_only = true

[plugins]
# 插件目录：`fuyubot run` 从这里加载所有动态库。
dir = "plugins"
# 插件日志的最低级别：error / warn / info / debug / trace，默认 **info**。
# 低于它的日志既不进宿主留档也不写 stderr——插件刷 Debug 是实打实的系统调用。
# 排查插件时调成 "debug" 或 "trace"。写错级别名会**报错**，不会静默当默认。
log_level = "info"
# 插件商店的索引地址（静态 JSON）。默认使用官方商店；换成别的 URL 即可，删掉这行则关闭商店。
registry_url = "https://catmoecircle.github.io/FuyuBot-plugins/index.json"

[tdlib]
# 留空 = 按 fuyubot-tdlib 的四级优先级自动找（环境变量 → 自带 → 系统库 → 裸库名）。
# 指定时给 tdjson 的**目录**或文件路径，例如 ".tdlib-cache/1.8.69/windows-x86_64"。
path = ""
# 日志详细度：默认 **1**（保留警告与错误）。TDLib 自己的默认更啰嗦——每轮 `td_receive`
# 的超时、`Begin to wait for updates…` 之类都会打到 stderr。要排查问题就调大。
log_verbosity = 1

# ── 插件配置段 ──────────────────────────────────────────────────────
# 每个插件在 `[plugin.<插件名>]` 下可以有自己的配置（键值任意、可嵌套）。
# 插件名 = `define_plugin!` / 脚手架里登记的那个名字（如 `fuyubot.manage`）。
# 运行时经 ABI 接口 `get_config` 读任意段（自己或别人的），经 `set_config`
# 只能写**自己**这一段——写别的插件那段会被宿主拒绝。
#
# 三层优先级（后者只填前者的缺失键）：
#   1. 本文件里的段（最高；插件写这些键会被拒绝）
#   2. plugin-config/<插件名>.toml（插件 set_config 的落盘）
#   3. 插件包里的 config.default.toml（包默认）
# 插件写配置**不会**改动这个文件，所以注释和 api_hash 都安全。
#
# 例：
# [plugin.fuyubot.manage]
# reply_prefix = "已安装插件："
# [plugin.my.weather]
# city = "上海"
# api_key = "……"
