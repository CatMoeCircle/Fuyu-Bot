[package]
name = "fuyubot-cli"
description = "fuyubot 命令行入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "fuyubot"
path = "src/main.rs"

[features]
default = []
# 透传给 fuyubot-tdlib：装出来的二进制自带 TDLib，用户无需手动装系统库。
vendored = ["fuyubot-tdlib/vendored"]

[dependencies]
clap.workspace = true
# 宿主编排层：`run` / `login` 与 Android JNI 共用同一条启动顺序。
fuyubot-app.workspace = true
fuyubot-core.workspace = true
fuyubot-loader.workspace = true
# 只用 `CONNECTION_UPDATE` / `ConnectionState`（连接更新的通道名与五个状态）；不碰它的 HostApi 那部分。
fuyubot-simplify.workspace = true
fuyubot-tdlib.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
# TUI 插件商店：索引/下载/解压/校验全部在这一层（不进运行时，也不单独建 crate）。
sha2.workspace = true
ureq.workspace = true
zip.workspace = true
sysinfo.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
