[package]
name = "fuyubot-cli"
description = "fuyubot 命令行入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "fuyubot"
path = "src/main.rs"

[features]
default = []
# 透传给 fuyubot-tdlib：装出来的二进制自带 TDLib，用户无需手动装系统库。
vendored = ["fuyubot-tdlib/vendored"]

[dependencies]
clap.workspace = true
fuyubot-core.workspace = true
fuyubot-loader.workspace = true
fuyubot-tdlib.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
