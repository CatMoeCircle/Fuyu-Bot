# fuyubot 项目配置；缺省值即可运行，详细说明见文档站。

[bot]
name = "__NAME__"

[telegram]
# bot：Bot Token；user：手机号 / 扫码。
account_type = "bot"
api_id = __API_ID__
data_dir = "data"
# 首次 run 后自动写入。
api_hash = ""

[roles]
# 主人 / 全局管理员 id；主人和管理员不受命令白名单影响。
# owners 为空时 user 账户默认自己是主人；填了就按列表来。
owners = []
admins = []

[cache]
# 每种 TDLib 对象类型的缓存条数，LRU 淘汰。
enabled = true
capacity = 100

[command]
# prefix = ["/"]   # 命令头数组；不写按账号默认，写了整套替换
whitelist = []     # 额外允许触发命令的用户 id
# ⚠️ 不建议关闭；false = 任何人都能触发。
whitelist_only = true

[plugins]
dir = "plugins"
log_level = "info"
registry_url = "https://catmoecircle.github.io/FuyuBot-plugins/index.json"

[tdlib]
path = ""           # 留空自动找 tdjson
log_verbosity = 1

# 插件配置：[plugin.<插件名>]，例如
# [plugin.fuyubot.manage]
# reply_prefix = "已安装插件："
