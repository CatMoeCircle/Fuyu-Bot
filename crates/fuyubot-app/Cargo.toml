[package]
name = "fuyubot-app"
description = "宿主应用编排：内核 → 宿主运行时 → 接 TDLib → 装插件 → 登录 → 分发（CLI / Android JNI 共用）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
fuyubot-core.workspace = true
# 授权 / 连接状态的订阅（事件总线的订阅句柄）。
fuyubot-event.workspace = true
fuyubot-loader.workspace = true
# 只借它的 `ConnectionState`（五个连接状态与解析）：CLI 与 JNI 用的是同一张表。
fuyubot-simplify.workspace = true
fuyubot-tdlib.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
