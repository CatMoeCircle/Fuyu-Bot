# 发布 fuyubot：按平台编出可执行文件，**内置插件直接编进本体包**，
# 最后由 publish 把它转成用户下载的各平台 zip：
#   fuyubot-<版本>-<OS>-<平台>.zip = fuyubot + tdjson + plugins/（内置插件）
#
# 资产名里带版本（例：`fuyubot-v0.1.0-windows-x86_64.zip`），所以同一页 Release 里
# 多个版本可以并存，用户能一眼看出下的是哪个版本。`<OS>` = windows / linux / macos，
# `<平台>` = x86_64 / aarch64。
#
# 本仓库只发**运行时**。脚本插件宿主（`fuyubot-script`）在 FuyuBot-Script 仓库发；
# 文档站在 FuyuBot-Docs。
#
# 桌面平台集合 = `crates/fuyubot-tdlib/src/loader/vendored.rs` 的 `ASSETS` 表：
#   Windows x86_64 / aarch64、Linux x86_64 / aarch64、macOS **只有 aarch64**
#   （Intel Mac 没有 runner，见 ASSETS 的注释）。
#
# **Android** 是额外的一条线（`build-android` job）：交叉编译出**可执行文件**
#   （`aarch64-linux-android` / `x86_64-linux-android` 的 ELF，不是 apk），
#   包结构与桌面一致（`fuyubot` + 同级 `libtdjson.so` + `plugins/`），
#   只是 tdjson 需要应用期交叉编译，而 loader 的 `ASSETS` 表不含 android。
#   同一个 job 还顺手打一个 JNI 包（`*-android-jni-<abi>.zip`，只有 `.so`）——
#   它**只作为 Actions artifact** 喂给下面的 APK job，**不再作为 Release 资产发布**。
#
# **APK** 又是一条线（`build-apk` job）：把本次运行产出的 JNI artifact 解压到
#   [FuyuBot-for-Android](https://github.com/CatMoeCircle/FuyuBot-for-Android) 的
#   `app/src/main/assets/fuyubot-kernel/`（上游约定的**指定目录**），跑
#   `./gradlew :app:assembleRelease`，再用 Secrets 里的 keystore 签名，产出
#   `fuyubot-<版本>-<abi>.apk`。壳的代码不在本仓，按 `main` 取。
#   不加 `-android-` 段也不撞名：可执行文件那批是 `fuyubot-<版本>-android-<平台>.zip`。
#
# 用户视角（`README.md` 与文档站的「使用」就是这么写的）：
#   下载 `fuyubot-<版本>-<OS>-<平台>.zip` → 解压 → `./fuyubot init` / `./fuyubot run`。
# 所以这三件事都是**契约**：资产名、zip **解压出来就是本体**（不再套一层目录）、
# 以及「tdjson 就在可执行文件旁边」。改之前先看
# `crates/fuyubot-tdlib/src/loader/vendored.rs` 的 ASSETS 表与
# `crates/fuyubot-tdlib/build.rs` 的 `stage_next_to_binary`。
#
# 中间产物（每平台一份 .tar.gz，内容已经是最终布局）只留在 Actions artifacts 里；
# zip 只在 publish（Linux）里生成——Windows runner 的 bash 没有 zip 命令，
# 别为它分叉。
#
# 与 `build-tdlib.yml` 分工：那边**只产 TDLib**（桌面 `TDLib-*` 发布资产 + Android 的
# `tdjson-android-<abi>`），这边**只产 fuyubot 本体**（含 Android 可执行文件），
# 不重新编 TDLib。所以这里要等对应版本的 TDLib 产物已经存在：
#   - 桌面：从 `TDLib-v<版本>` Release 下 `TDLib-<os>-<arch>`；
#   - Android：同样先看 Release 上的 `TDLib-android-<arch>`；**没有**就退回最近一次
#     成功的 `build-tdlib` 运行的 artifact（现在 Android 的 tdjson 还没进 Release——
#     发布门禁要求全平台启用）。等它进了 Release，这条退回分支自然不再走。
#
# 桌面平台每行都有 `enabled` 开关（**默认全 `True`**，行为与以前一致）：
# 只想产某几个平台时把其余行改 `False` 即可，矩阵不能为空（空时塞一行占位）。
name: release bot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Android 的 tdjson 可能要从「最近一次成功的 build-tdlib 运行」的 artifact 里取，
  # `gh run list/download` 需要 actions:read。
  actions: read

env:
  # ⚠️ 必须与 `crates/fuyubot-tdlib/Cargo.toml` 的 `[package.metadata.fuyubot] tdlib-version`
  #    一致（也等于 `build-tdlib.yml` 里填的 tdlib_version）：Release tag 与 `.tdlib-cache`
  #    的目录名都按它拼，填错就是 404 / 找不到缓存。
  TDLIB_VERSION: '1.8.69'
  CARGO_TERM_COLOR: always

jobs:
  # ⚠️ 为什么要有 plan：job 级 `if` **拿不到 `matrix` 上下文**（GitHub 在展开矩阵之前就求值，
  #    写 `if: matrix.enabled` 会直接
  #    `Invalid workflow file ... Unrecognized named-value: 'matrix'`）。
  #    所以这里先算出一份「只有启用行」的矩阵输出，真正的门禁看 `needs.plan.outputs.count`。
  #    矩阵本身不能为空 → 一个都没启用时塞一行占位（job 已被 count 挡掉，不会真跑）。
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      count: ${{ steps.plan.outputs.count }}
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
      android_plan: ${{ steps.plan.outputs.android_plan }}
      android_count: ${{ steps.plan.outputs.android_count }}
      apk_matrix: ${{ steps.plan.outputs.apk_matrix }}
      apk_count: ${{ steps.plan.outputs.apk_count }}
    steps:
      - name: Compute the enabled platform matrices
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          # 桌面每行都有 `enabled` 开关（默认全 True）：只想产某几个平台时把其余行改 False。
          platforms = [
              {"os": "windows-latest", "asset": "fuyubot-windows-x86_64", "tdlib": "TDLib-windows-x86_64", "platform_dir": "windows-x86_64", "bin": "fuyubot.exe", "enabled": True},
              # runner 标签与 build-tdlib.yml 的 matrix 保持一致（那边产的就是 ARM64 资产）
              {"os": "windows-11-vs2026-arm", "asset": "fuyubot-windows-aarch64", "tdlib": "TDLib-windows-aarch64", "platform_dir": "windows-aarch64", "bin": "fuyubot.exe", "enabled": True},
              {"os": "ubuntu-latest", "asset": "fuyubot-linux-x86_64", "tdlib": "TDLib-linux-x86_64", "platform_dir": "linux-x86_64", "bin": "fuyubot", "enabled": True},
              {"os": "ubuntu-24.04-arm", "asset": "fuyubot-linux-aarch64", "tdlib": "TDLib-linux-aarch64", "platform_dir": "linux-aarch64", "bin": "fuyubot", "enabled": True},
              # macOS 只出 aarch64（Intel Mac 没有 runner；与 ASSETS 表一致）。
              # ⚠️ `macos-14` 已于 2026-11-02 退役，用户实际会看到
              # 「不支持配置 macos-14-arm64-us-default」。用 `macos-15`，别用 `macos-latest`
              # （后者随大版本静默漂移）。
              {"os": "macos-15", "asset": "fuyubot-macos-aarch64", "tdlib": "TDLib-macos-aarch64", "platform_dir": "macos-aarch64", "bin": "fuyubot", "enabled": True},
          ]
          # Android：**交叉编译**，不在上面那张表里（那张表的 `tdlib` 都是从 Release 下的
          # `TDLib-<os>-<arch>`）。这边的 `tdlib` 先试 Release 上的 `TDLib-android-<arch>`，
          # 没有就退回最近一次成功 build-tdlib 的 artifact `tdlib-<版本>-android-<abi>`。
          android = [
              {"os": "ubuntu-22.04", "asset": "fuyubot-android-aarch64", "tdlib": "TDLib-android-aarch64", "abi": "arm64-v8a", "arch": "aarch64", "target": "aarch64-linux-android", "bin": "fuyubot", "enabled": True},
              {"os": "ubuntu-22.04", "asset": "fuyubot-android-x86_64", "tdlib": "TDLib-android-x86_64", "abi": "x86_64", "arch": "x86_64", "target": "x86_64-linux-android", "bin": "fuyubot", "enabled": True},
          ]
          # APK：**同一个 JNI 包**，塞进 FuyuBot-for-Android 的壳里再编一次。
          # `abi` 决定取哪个 `fuyubot-<版本>-android-jni-<abi>.zip`，也是 APK 文件名的那一段。
          # `enabled` 与上面两张表各自独立：内核没成时这一批会因缺包失败，那是对的信号。
          apk = [
              {"os": "ubuntu-latest", "abi": "arm64-v8a", "arch": "aarch64", "enabled": True},
              {"os": "ubuntu-latest", "abi": "x86_64", "arch": "x86_64", "enabled": True},
          ]

          def pack(rows, placeholder):
              rows = [row for row in rows if row.get("enabled")]
              return {"include": rows or [placeholder]}

          desktop_placeholder = {"os": "ubuntu-latest", "asset": "fuyubot-none-none", "tdlib": "TDLib-none-none", "platform_dir": "none-none", "bin": "fuyubot"}
          android_placeholder = {"os": "ubuntu-22.04", "asset": "fuyubot-none-none", "tdlib": "TDLib-none-none", "abi": "none", "arch": "none", "target": "aarch64-linux-android", "bin": "fuyubot"}
          apk_placeholder = {"os": "ubuntu-latest", "abi": "none", "arch": "none"}

          print("matrix=" + json.dumps(pack(platforms, desktop_placeholder), separators=(",", ":")))
          print("plan=" + json.dumps({"include": platforms}, separators=(",", ":")))
          print("count=" + str(len([row for row in platforms if row.get("enabled")])))
          print("android_matrix=" + json.dumps(pack(android, android_placeholder), separators=(",", ":")))
          print("android_plan=" + json.dumps({"include": android}, separators=(",", ":")))
          print("android_count=" + str(len([row for row in android if row.get("enabled")])))
          print("apk_matrix=" + json.dumps(pack(apk, apk_placeholder), separators=(",", ":")))
          print("apk_count=" + str(len([row for row in apk if row.get("enabled")])))
          PY

  build:
    name: package ${{ matrix.asset }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # 把该平台的 tdjson 放进构建缓存的**约定布局** `<缓存根>/<版本>/<os>-<arch>/`：
      # `fuyubot-tdlib/build.rs` 会从那儿把它拷到可执行文件同级目录。
      - name: Fetch TDLib binaries into the build cache
        shell: bash
        run: |
          set -euo pipefail
          dest=".tdlib-cache/${TDLIB_VERSION}/${{ matrix.platform_dir }}"
          mkdir -p "$dest"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/TDLib-v${TDLIB_VERSION}/${{ matrix.tdlib }}"
          curl -fsSL -o tdlib.tar.gz "$url"
          tar -xzf tdlib.tar.gz
          # 归档内层目录就是资产名；`td_api.tl` 不在这里（它由 build.rs 自己下）
          cp -a "${{ matrix.tdlib }}/." "$dest/"

      - name: Build fuyubot + 内置插件
        shell: bash
        env:
          FUYUBOT_TDLIB_VENDORED_CACHE: ${{ github.workspace }}/.tdlib-cache
        run: >-
          cargo build --release
          -p fuyubot-cli
          -p fuyubot-plugin-start -p fuyubot-plugin-help -p fuyubot-plugin-manage

      # 每平台**只出一份**中间包，里面的目录就是用户解压后看到的东西：
      #   fuyubot(.exe) + 该平台的 tdjson + plugins/（内置插件）+ README.txt
      # 内置插件不再单独打包——它本来就只在本体旁边才有意义，分开只会多一个
      # 「下了本体却忘了下插件包」的出错面。
      # 先打 .tar.gz（跨平台都能打、也不受 zip 命令有无影响），转成 zip 是 publish 的事。
      - name: Package the runtime (executable + tdjson + builtin plugins)
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="${{ matrix.asset }}"   # fuyubot-<OS>-<平台>，例 fuyubot-windows-x86_64
          bin="${{ matrix.bin }}"
          case "$bin" in *.exe) ext=".exe" ;; *) ext="" ;; esac

          # 版本：tag 推送就直接用 tag 名（v0.1.0）；分支上的手动构建没有版本号，退回短 sha
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            version="$GIT_REF_NAME"
          else
            version="dev-${GIT_SHA:0:7}"
          fi
          pkg="fuyubot-${version}-${asset#fuyubot-}"   # 例：fuyubot-v0.1.0-windows-x86_64

          stage="dist/$pkg"
          mkdir -p "$stage/plugins"

          cp "target/release/${bin}" "$stage/"
          # 该平台的 tdjson（loader 优先级 2 靠「可执行文件同级」命中）
          cp -a ".tdlib-cache/${TDLIB_VERSION}/${{ matrix.platform_dir }}/." "$stage/"
          # TDLib 资产里的说明是给 loader 看的，不该混进面向用户的包
          rm -f "$stage/README.md" "$stage/VERSION.json" \
                "$stage/build-info.txt" "$stage/tdjson.lib"

          # 内置插件：直接进本体的 plugins/，不再单独打包
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) lib="dll" ;;
            Darwin) lib="dylib" ;;
            *) lib="so" ;;
          esac
          # cdylib 的**文件名**随平台变：Windows 是 `fuyubot_plugin_start.dll`，
          # Linux / macOS 上 rustc 会给它加 `lib` 前缀（`libfuyubot_plugin_start.so` / `.dylib`）。
          # 但包里的名字必须是**无前缀**的 `fuyubot_plugin_start.<ext>`：
          # `scaffold::install_builtins` 按 `{stem}.{DLL_EXTENSION}` 找文件，
          # 带前缀它认不出来，`init` 的「自动装内置插件」会**静默**跳过。
          # 所以源文件两种名字都试，目标名固定无前缀。
          for stem in fuyubot_plugin_start fuyubot_plugin_help fuyubot_plugin_manage; do
            src="target/release/${stem}.${lib}"
            [[ -f "$src" ]] || src="target/release/lib${stem}.${lib}"
            [[ -f "$src" ]] || {
              echo "找不到内置插件产物：${stem}.${lib}（带 lib 前缀的也试过了）" >&2
              exit 1
            }
            cp "$src" "$stage/plugins/${stem}.${lib}"
          done

          # 用 printf 而不是 heredoc：YAML 块标量会把内容整体缩进，缩进的 `EOF` 不会终止 heredoc
          printf '%s\n' \
            "$("./target/release/${bin}" --version) — 基于 TDLib 的 Telegram bot 框架" \
            "TDLib ${TDLIB_VERSION} 已打包在同目录（不要删 tdjson）" \
            "内置插件在同级的 plugins/（/start、/help、/plugins），init/run 会自动装进项目" \
            "" \
            "起步：" \
            "  ./fuyubot${ext} init --dir demo --name mybot --api-id <你的 api_id>" \
            "  ./fuyubot${ext} run  --config demo/fuyubot.toml" \
            "" \
            "文档：https://github.com/${GITHUB_REPOSITORY}" \
            > "$stage/README.txt"

          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          ls -lhR dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------- Android（交叉编译，可执行文件不是 apk）----------------
  # 本 job **只编 fuyubot**，tdjson 从 `build-tdlib.yml` 的产物里拿：
  #   1. 先看 `TDLib-v<版本>` Release 上的 `TDLib-android-<arch>`（还不是 loader 资产，
  #      等它进 Release 后这条就命中）；
  #   2. 没有就退回**最近一次成功的 build-tdlib 运行**的 artifact
  #      `tdlib-<版本>-android-<abi>`（`actions:read` 权限就是给这一步的）。
  # 拿到后按 `.tdlib-cache/<版本>/android-<arch>/` 布局铺开——`fuyubot-tdlib/build.rs`
  # 会把库拷到可执行文件同级，loader 的优先级 2b（可执行文件目录）在设备上就能命中。
  build-android:
    name: ${{ matrix.asset }}
    needs: plan
    if: needs.plan.outputs.android_count != '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.android_matrix) }}
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_API_LEVEL: "21"
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        shell: bash
        run: chmod +x .github/scripts/*.sh

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # 只编 Rust，但依赖树里有 C 代码（`ureq` → `ring`，按 host 编译），要有 cc/ld。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ca-certificates curl

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null || true
          fi
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 两个来源都可能失败，所以整段容错：真正的判据是下一步「必须存在 libtdjson.so」。
      - name: "Fetch Android tdjson (Release first, else latest build-tdlib artifact)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tarball=""
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/TDLib-v${TDLIB_VERSION}/${{ matrix.tdlib }}"
          if curl -fsSL --retry 2 -o "$work/tdjson.tar.gz" "$url"; then
            echo "==> 从 Release 取到 ${{ matrix.tdlib }}"
            tarball="$work/tdjson.tar.gz"
          else
            echo "warning: Release 上没有 ${{ matrix.tdlib }}（$url），退回最近一次成功的 build-tdlib artifact" >&2
            run_id="$(gh run list --workflow build-tdlib.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            if [[ -n "$run_id" ]]; then
              echo "==> 用 run $run_id 的 artifact tdlib-${TDLIB_VERSION}-android-${{ matrix.abi }}"
              gh run download "$run_id" \
                --name "tdlib-${TDLIB_VERSION}-android-${{ matrix.abi }}" \
                --dir "$work/artifact" || true
              # ⚠️ 别按扩展名找：TDLib 资产名是 `<os>-<arch>` 口径、**不带扩展名**
              #    （loader 那边 asset_name() 拼进 URL 的就是它），内容才是 tar.gz。
              tarball="$(find "$work/artifact" -type f | head -n1 || true)"
            fi
          fi
          if [[ -z "$tarball" || ! -f "$tarball" ]]; then
            echo "error: 拿不到 Android 的 tdjson。先跑一次 build-tdlib（tdlib_version=${TDLIB_VERSION}）" >&2
            exit 1
          fi
          dest=".tdlib-cache/${TDLIB_VERSION}/android-${{ matrix.arch }}"
          mkdir -p "$dest" "$work/unpack"
          tar -xzf "$tarball" -C "$work/unpack" --strip-components=1
          cp -a "$work/unpack/." "$dest/"
          ls -lh "$dest"

      - name: Check tdjson is in place
        shell: bash
        run: |
          set -euo pipefail
          lib=".tdlib-cache/${TDLIB_VERSION}/android-${{ matrix.arch }}/libtdjson.so"
          [[ -f "$lib" ]] || { echo "error: 缺 $lib" >&2; exit 1; }
          ls -lh "$lib"

      - name: Build fuyubot for Android
        shell: bash
        env:
          FUYUBOT_TDLIB_VENDORED_CACHE: ${{ github.workspace }}/.tdlib-cache
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          triple="${{ matrix.target }}"
          # cargo 的 linker 环境变量名是 `CARGO_TARGET_<TRIPLE 大写下划线>_LINKER`
          upper="$(printf '%s' "$triple" | tr 'a-z-' 'A-Z_')"
          linker="$toolchain/bin/${triple}${ANDROID_API_LEVEL}-clang"
          export "CARGO_TARGET_${upper}_LINKER=$linker"
          export "CC_${triple//-/_}=$linker"
          export "AR_${triple//-/_}=$toolchain/bin/llvm-ar"
          echo "==> linker: $linker"
          # 16KB 页对齐（Android 15 的 16KB 页设备要求所有 .so 的 PT_LOAD 对齐 >= 0x4000）。
          # tdjson 那边由 cmake 的 `ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON` 管，这里管我们自己编的。
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release --target "$triple" \
            -p fuyubot-cli -p fuyubot-android \
            -p fuyubot-plugin-start -p fuyubot-plugin-help -p fuyubot-plugin-manage
          ls -lh "target/$triple/release/fuyubot" "target/$triple/release/libfuyubotjni.so"

      - name: Package fuyubot (Android)
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 版本口径与桌面一致：tag 推送用 tag 名（v0.1.2），分支上手动跑用短 sha
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            version="$GIT_REF_NAME"
          else
            version="dev-${GIT_SHA:0:7}"
          fi
          pkg="fuyubot-${version}-android-${{ matrix.arch }}"
          # 参数顺序（见脚本头）：<triple> <arch> <tdlib版本> <tdlib commit> <dist> [tdjson目录] [包名]
          # ⚠️ 第 6 个是 **tdjson 目录**，不是包名——少写一个就会把包名当成目录，
          #    报「fuyubot-…-android-aarch64 里没有 libtdjson.so」。
          .github/scripts/package-bot-android.sh \
            "${{ matrix.target }}" "${{ matrix.arch }}" "$TDLIB_VERSION" \
            "${GIT_SHA}" dist \
            ".tdlib-cache/${TDLIB_VERSION}/android-${{ matrix.arch }}" \
            "$pkg"

      # JNI 运行时（只有 .so）：给 APK job 用，**不是**可执行文件、也不是 apk。
      # 同一个 job、同一份交叉编译产物，只是多打一个 zip（`libfuyubotjni.so` + `libtdjson.so`）。
      # ⚠️ 这个 zip **只走 Actions artifact**，publish 会跳过它，不挂 Release。
      - name: Package fuyubotjni (Android)
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            version="$GIT_REF_NAME"
          else
            version="dev-${GIT_SHA:0:7}"
          fi
          pkg="fuyubot-${version}-android-jni-${{ matrix.abi }}"
          # 参数顺序（见脚本头）：<triple> <abi> <tdlib版本> <tdlib commit> <dist> [tdjson目录] [包名]
          .github/scripts/package-fuyubot-jni.sh \
            "${{ matrix.target }}" "${{ matrix.abi }}" "$TDLIB_VERSION" \
            "$GIT_SHA" dist \
            ".tdlib-cache/${TDLIB_VERSION}/android-${{ matrix.arch }}" \
            "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # 可执行文件包（.tar.gz）与 JNI 包（.zip）都从这里上传；
          # JNI 包只给 APK job 用，publish 会把它从 dist 里剔掉，不进 Release。
          path: dist/*
          if-no-files-found: error

  # ---------------- Android APK（把上面的 JNI 包塞进上游壳里再编一次）----------------
  # 上游仓库 [FuyuBot-for-Android](https://github.com/CatMoeCircle/FuyuBot-for-Android)
  # 只有 Kotlin + Compose 的壳，**不含内核**；它的构建前提就是
  #   app/src/main/assets/fuyubot-kernel/   ← 本仓产的 JNI 包解压到这里
  # 缺了这个目录 gradle 照样编得出 APK，只是装到设备上第一次启动就报「资产中缺少内核目录」。
  # 所以这里的判据是「APK 里真的有 assets/fuyubot-kernel/lib*.so」（见打包脚本第 6 步）。
  #
  # 内核与壳**同版本发**：APK 版本号取自本仓的 tag，不跟上游仓库的 Release 走。
  # 这样同一个 Release 页上，`fuyubot-<版本>-<abi>.apk` 里装的内核就是
  # 同一个 tag 的 `build-android` job 编出来的 JNI artifact（该 zip 本身不进 Release）。
  #
  # 签名用 Secrets（缺一个就整条失败——宁可不发 APK，也不要发一个装不上的包）：
  #   ANDROID_KEYSTORE_BASE64      keystore 文件的 base64（单行）
  #   ANDROID_KEYSTORE_PASSWORD    store 口令
  #   ANDROID_KEY_ALIAS            key 别名
  #   ANDROID_KEY_PASSWORD         key 口令
  # 覆盖升级要求**同一个 keystore**：换了它，老用户装新 APK 会报签名冲突，只能先卸载。
  build-apk:
    name: apk ${{ matrix.abi }}
    needs: [plan, build-android]
    # ⚠️ 不要求 `build-android` **整体**成功：那两个 ABI 是各自独立的矩阵行，一个挂了不该把
    #    另一个的 APK 也连坐（2026-11 踩过：x86_64 的 JNI 包因一条恒假的校验挂掉，
    #    arm64 明明编好了，两个 APK 却全被跳过）。这里按 abi 逐个看结果。
    #    `gh run download` 找不到 artifact 时会自己退回 Release，丢了哪一边也还有得救。
    if: >-
      needs.plan.outputs.apk_count != '0' && !cancelled() &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'failure')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.apk_matrix) }}
    steps:
      - uses: actions/checkout@v4

      # 壳仓库用自己的 checkout：它不进本仓的 history，也不该被 submodule 绑死版本。
      - uses: actions/checkout@v4
        with:
          repository: CatMoeCircle/FuyuBot-for-Android
          ref: main
          path: android-app

      - name: Make scripts executable
        shell: bash
        run: chmod +x .github/scripts/*.sh

      # 用 JDK 21：壳仓库的 `app/build.gradle.kts` 把 sourceCompatibility / targetCompatibility
      # 与 Kotlin `jvmTarget` 都钉在 21，用 17 编不过（AGP 9.2 自称「最低 17」救不了这一点）。
      # ⚠️ 别依赖 runner 的默认 JDK：`ubuntu-latest` 正在 24.04→26.04 迁移，
      #    前者默认 17、后者默认 25，同一周不同 job 可能拿到不同版本。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 壳的 compileSdk 是 37.1，比 AGP 9.2 官方支持的 37.0 高一个 minor，会报
      # `COMPILE_SDK_VERSION_TOO_HIGH` **警告**——不是错误，不影响产出，所以这里不压它
      # （压掉 `android.suppressUnsupportedCompileSdk` 会把真正值得看的告警一起藏起来）。
      # 别在这里写死 build-tools 版本：脚本会取 SDK 里最新的那一份。
      - name: Ensure the Android platform used by the shell is installed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$ANDROID_HOME/platforms/android-37.1" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.1" > /dev/null
          fi
          echo "JAVA_HOME=$JAVA_HOME ($(java -version 2>&1 | head -1))"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Download the matching JNI bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist jni
          # 版本口径与桌面 / Android job 一致：tag 推送用 tag 名，分支上手动跑用短 sha。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "FUYUBOT_APK_VERSION=$version" >> "$GITHUB_ENV"
          name="fuyubot-${version}-android-jni-${{ matrix.abi }}"
          echo "==> 取 ${name}.zip"
          # JNI 包**只作为本次运行的 Actions artifact**（不再挂 Release）：
          # 它本来就不可能出现在 Release 里，别再加 Release 兜底。
          # `gh run download --dir jni` 会把 artifact 里的文件**平铺**进 jni/（只有单个 artifact
          # 时不再套一层目录），所以下面按文件名找就行——别假设有子目录。
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fuyubot-android-${{ matrix.arch }}" --dir jni
          zip_path="$(find jni -name "${name}.zip" | head -n1)"
          [[ -n "$zip_path" ]] || { echo "error: 没找到 ${name}.zip" >&2; find jni -type f | head -20 >&2; exit 1; }
          # 只在名字/位置真的不一样时才挪（`mv a a` 在 GNU mv 下是错误，直接打死 job）。
          if [[ "$zip_path" != "jni/${name}.zip" ]]; then
            mv "$zip_path" "jni/${name}.zip"
          fi
          ls -lh jni/

      - name: Build and sign the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # keystore 从 Secrets 还原到临时目录：绝不进 workspace（免得被 upload-artifact 带上）。
          ks="$(mktemp -d)/release-keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          export FUYUBOT_ANDROID_KEYSTORE="$ks"
          export FUYUBOT_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export FUYUBOT_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export FUYUBOT_ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          .github/scripts/build-android-apk.sh \
            "jni/fuyubot-${FUYUBOT_APK_VERSION}-android-jni-${{ matrix.abi }}.zip" \
            android-app \
            "${{ matrix.abi }}" \
            "$FUYUBOT_APK_VERSION" \
            dist
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fuyubot-apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, build-android, build-apk]
    # 只发 tag：在分支上 `workflow_dispatch`（验证构建用）时 `ref_name` 是 `master`，
    # 照旧发版会创建 / 覆盖一个叫 master 的 Release。
    # 桌面那批被 `enabled: False` 停掉时（那批 job 全 skip），只要 Android 成功就照样发，
    # 所以不能用默认的「needs 全成功」，得显式看各 job 的结果。
    # ⚠️ APK 失败**不拦**整页发布（zip 那批是独立的交付物），但没有 APK 时下面的表格与说明
    #    会自动少掉那两行——别让「APK 没编出来」变成「整个 Release 都没了」。
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && (needs.build.result == 'success' || needs.build-android.result == 'success' || needs.build-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 中间包 → zip。**从包目录内部**打，所以 zip 里**没有**外层目录：
      # 用户解压到哪个目录，本体就在哪个目录（`./fuyubot init` 直接能跑）。
      - name: Turn each bundle into a flat zip
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/dist"
          # nullglob：一个 tar.gz 都没有时别把字面量 `dist/fuyubot-*.tar.gz` 当文件名（桌面全停时）。
          shopt -s nullglob
          for bundle in dist/fuyubot-*.tar.gz; do
            pkg="$(basename "$bundle" .tar.gz)"
            stage="$(mktemp -d)"
            tar -xzf "$bundle" -C "$stage"   # → $stage/$pkg/{fuyubot, tdjson, plugins/, README.txt}
            ( cd "$stage/$pkg" && zip -q -r -X "$out/$pkg.zip" . )
            rm -rf "$stage"
          done
          # JNI 内核是 Actions artifact（APK job 自己取），会被 download-artifact 一并铺进
          # dist/；它不进 Release，这里删掉，免得下面的 `dist/*.zip` 把它带上。
          for jni in dist/fuyubot-*-android-jni-*.zip; do
            echo "drop from Release (Actions artifact only): $(basename "$jni")"
            rm -f "$jni"
          done
          shopt -u nullglob
          ls -lh dist/*.zip dist/*.apk 2>/dev/null || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          shopt -s nullglob
          # 下载表从实际产物生成——别手抄 matrix，加平台时它自己会多一行（AGENTS 约束 46 的教训）。
          # ⚠️ 标签必须**按扩展名分派**：APK 叫 `fuyubot-<版本>-<abi>.apk`，而可执行文件包叫
          #    `fuyubot-<版本>-android-<平台>.zip`，两者基名不撞；但同一张 case 里若只按基名匹配，
          #    `-x86_64` 会把 `…-android-x86_64` 与 APK 的 `…-x86_64` 混成一个标签。
          table="$(
            for file in dist/fuyubot-*.apk dist/fuyubot-*.zip; do
              name="$(basename "$file")"
              ext="${name##*.}"
              name="${name%.*}"
              case "$ext:$name" in
                apk:*-arm64-v8a)   label="Android（arm64-v8a，**APK**，开箱即用）" ;;
                apk:*-x86_64)      label="Android（x86_64，**APK**，模拟器）" ;;
                zip:*-windows-x86_64)  label="Windows 10/11（x64）" ;;
                zip:*-windows-aarch64) label="Windows 11（ARM64）" ;;
                zip:*-linux-x86_64)    label="Linux（x86_64）" ;;
                zip:*-linux-aarch64)   label="Linux（ARM64）" ;;
                zip:*-macos-aarch64)   label="macOS（Apple Silicon）" ;;
                zip:*-android-aarch64) label="Android（arm64-v8a，可执行文件）" ;;
                zip:*-android-x86_64)  label="Android（x86_64，模拟器 / 可执行文件）" ;;
                *)                 label="$name.$ext" ;;
              esac
              printf '| %s | `%s.%s` |\n' "$label" "$name" "$ext"
            done
          )"
          notes=$(printf '%s\n' \
            "## 下载" \
            "" \
            "每个平台一个 zip：**解压出来就是本体**（没有额外的一层目录），" \
            "TDLib 动态库与可执行文件同级，内置插件（/start、/help、/plugins）在 \`plugins/\` 里。" \
            "" \
            "\`*-<abi>.apk\`（如 \`fuyubot-v0.1.3-arm64-v8a.apk\`）是**可直接安装的 Android 图形客户端**（界面在" \
            "[FuyuBot-for-Android](https://github.com/CatMoeCircle/FuyuBot-for-Android)，" \
            "内核由本仓同 tag 编出、随 APK 一起打包）。" \
            "真机用 \`arm64-v8a\`，模拟器用 \`x86_64\`；两个 APK 只能装一个（包名相同）。" \
            "" \
            "| 系统 | 资产 |" \
            "| --- | --- |" \
            "$table" \
            "" \
            "脚本插件宿主（\`fuyubot-script\`）在 FuyuBot-Script 仓库的 Release 里单独发布。")
          # 资产表从实际产物拼，所以这里也按实际文件上传：没有 APK 的构建不该塞一个空通配符。
          # ⚠️ 别写成 `[[ ... ]] && assets+=(...)`：条件为假时整条 AND 列表返回 1，
          #    `set -e` 会当场把 publish 打死（这是 bash 的经典坑）。
          assets=(dist/*.zip)
          apks=(dist/*.apk)
          if [[ ${#apks[@]} -gt 0 ]]; then
            assets+=("${apks[@]}")
          fi
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "warning: 没有任何产物可发（dist/ 是空的）" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" --title "fuyubot $TAG" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
